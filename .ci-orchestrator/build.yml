type: pipeline_definition
product: Liberty
name: CiGradle
description: Run a Pipeline for ci.gradle using Cognitive Software Delivery infrastructure

triggers:
- type: manual
  triggerName: "Manual"
  description: "Runs a ci.gradle Pipeline, building and testing the PR - Manual Trigger"
  triggerRank: 50
  groups: ["CommonComponents"]
- type: github
  triggerName: "GitHub"
  description: "Runs a ci.gradle Pipeline, building and testing the PR - Github Trigger"
  triggerRank: 50
  groups: ["CommonComponents"]
  keyword: "!build"
  aliasKeywords:
    - "#build"

steps:
- stepGroup: Build ci.gradle Dependency
  includeSteps:
  - file: steps/buildCiGradleDependency.yml
- stepGroup: Build ci.gradle
  includeSteps:
  - file: steps/buildCiGradle.yml
